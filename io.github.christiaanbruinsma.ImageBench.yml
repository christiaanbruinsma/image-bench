app-id: io.github.christiaanbruinsma.ImageBench
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: image-bench
separate-locales: false

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/image-bench/cargo-home

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: image-bench
    buildsystem: meson
    config-opts:
      - -Dprofile=default
    sources:
      - type: dir
        path: .
