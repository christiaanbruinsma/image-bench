[package]
name = "image-bench"
version = "0.9.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Resize and optimize batches of images locally"

[lib]
name = "image_bench"
path = "src/lib.rs"

[[bin]]
name = "image-bench"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_50"] }
glycin = { version = "3.1.0", features = ["gdk4"] }
fast_image_resize = "6.1.0"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }

